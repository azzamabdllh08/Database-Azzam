<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | RBI Dashboard</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Segoe UI,Arial;color:#172033}.box{width:360px;max-width:90%;background:#fff;padding:32px;border-radius:16px;box-shadow:0 15px 40px #14213d18}.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#e31b23,#0a8f5b);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin:auto}.box h2{text-align:center;margin:14px 0 4px}.box p{text-align:center;color:#687386;margin:0 0 24px;font-size:13px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid #dce2ea;border-radius:8px;box-sizing:border-box}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#14213d;color:#fff;font-weight:800;cursor:pointer}.error{display:none;color:#dc3545;text-align:center;font-size:13px;margin-top:12px}</style></head><body><div class="box"><div class="logo">P</div><h2>RBI Dashboard</h2><p>Asset & Project · Risk Based Inspection</p><form id="loginForm"><label>Username</label><input id="username" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>LOGIN</button><div id="error" class="error">Username atau password salah.</div></form></div><script src="login.js"></script></body></html>
