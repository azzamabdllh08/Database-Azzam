<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Site Verification Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box {
      width: 380px;
      max-width: 90%;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .error {
      display: none;
      color: #dc2626;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      Asset & Project
    </div>

    <div class="subtitle">
      Site Verification Dashboard
    </div>

    <form id="loginForm">

      <label for="username">
        Username
      </label>

      <input
        type="text"
        id="username"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        LOGIN
      </button>

      <div id="error" class="error">
        Username atau password salah.
      </div>

    </form>

  </div>

  <script src="login.js"></script>

</body>
</html>
