name: Sync RBI Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  sync-rbi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Microsoft Graph access token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/consumers/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=Files.Read User.Read offline_access" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error_description", "Token response OK")); raise SystemExit(1 if "error" in d else 0)'
          TOKEN=$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Get personal OneDrive
        run: |
          set -e
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "https://graph.microsoft.com/v1.0/me/drive")
          DRIVE_ID=$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          test -n "$DRIVE_ID"
          echo "DRIVE_ID=${DRIVE_ID}" >> "$GITHUB_ENV"

      - name: Download RBI Excel
        run: |
          set -e
          FILE_PATH="Zona 13/Asset Register & Verifikasi/Dashboard/Input RBI.xlsx"
          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('''${FILE_PATH}''', safe='/'))")
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/${ENCODED_PATH}")
          ITEM_ID=$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          if [ -z "$ITEM_ID" ]; then
            echo "Input RBI.xlsx not found at: ${FILE_PATH}"
            echo "$RESPONSE"
            exit 1
          fi
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content" \
            -o rbi/Input\ RBI.xlsx
          ls -lh rbi/Input\ RBI.xlsx

      - name: Install Python dependency
        run: python -m pip install --upgrade pip openpyxl

      - name: Generate RBI data
        working-directory: rbi
        run: python sync_rbi.py

      - name: Commit RBI data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rbi/data.js
          if git diff --cached --quiet; then
            echo "No RBI data changes detected."
          else
            git commit -m "Update RBI dashboard data"
            git push origin HEAD:main
          fi
