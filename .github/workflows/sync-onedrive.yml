name: Sync Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -e

          echo "Requesting Microsoft Graph token..."

          RESPONSE=$(curl -sS \
            -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          echo "$RESPONSE" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          if 'access_token' not in data:
              print(data)
              sys.exit(1)
          print('Graph token successfully obtained.')
          "

          TOKEN=$(echo "$RESPONSE" | python -c "
          import sys,json
          print(json.load(sys.stdin)['access_token'])
          ")

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Encode OneDrive sharing URL
        env:
          ONEDRIVE_URL: "https://1drv.ms/x/c/8dd2c5d0a467a39a/IQBvKUJCpgGTT4rvYLy4Gt9FAbedI0g-V_jUTXwlA3QXwNI?e=fXkoQM"
        run: |
          set -e

          SHARE_ID=$(python -c "
          import base64
          import os

          url = os.environ['ONEDRIVE_URL']

          encoded = base64.urlsafe_b64encode(
              url.encode('utf-8')
          ).decode('utf-8').rstrip('=')

          print('u!' + encoded)
          ")

          echo "SHARE_ID=$SHARE_ID" >> "$GITHUB_ENV"

          echo "Sharing URL encoded successfully."

      - name: Download Excel through Microsoft Graph
        run: |
          set -e

          echo "Downloading Excel through Microsoft Graph..."

          curl -L \
            --fail-with-body \
            --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o source.xlsx

          echo "Download completed."

          file source.xlsx
          ls -lh source.xlsx

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade openpyxl

      - name: Generate dashboard data
        run: |
          python sync_excel.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto sync Excel data from OneDrive"
            git push
          fi
