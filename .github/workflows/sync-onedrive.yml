name: Sync Excel from OneDrive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. GET DELEGATED MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}

        run: |
          set -e

          echo "Requesting delegated Microsoft Graph token..."

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/consumers/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=Files.Read offline_access" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          echo "Checking token response..."

          ERROR=$(python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('error',''))
          " <<< "$RESPONSE")

          if [ -n "$ERROR" ]; then
            echo "ERROR: Microsoft token request failed."
            echo "$RESPONSE"
            exit 1
          fi

          TOKEN=$(python -c "
          import json,sys
          print(json.load(sys.stdin)['access_token'])
          " <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Access token was empty."
            exit 1
          fi

          echo "TOKEN=${TOKEN}" >> "$GITHUB_ENV"

          echo "Microsoft Graph delegated token obtained successfully."


      # ============================================================
      # 3. CHECK CURRENT USER ONEDRIVE
      # ============================================================
      - name: Get My OneDrive
        run: |
          set -e

          echo "Getting current user's OneDrive..."

          HTTP_CODE=$(curl -sS \
            -o drive.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/me/drive")

          echo "HTTP STATUS: ${HTTP_CODE}"

          cat drive.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Unable to access OneDrive."
            exit 1
          fi

          DRIVE_ID=$(python -c "
          import json
          d=json.load(open('drive.json'))
          print(d.get('id',''))
          ")

          if [ -z "$DRIVE_ID" ]; then
            echo "ERROR: Drive ID not found."
            exit 1
          fi

          echo "DRIVE_ID=${DRIVE_ID}" >> "$GITHUB_ENV"

          echo "OneDrive found successfully."


      # ============================================================
      # 4. FIND EXCEL FILE
      # ============================================================
      - name: Find Excel file
        run: |
          set -e

          FILE_PATH="Zona 13/Asset Register & Verifikasi/Dashboard/Site_Verification_PowerBI_Ready.xlsx"

          echo "Searching OneDrive for:"
          echo "$FILE_PATH"

          ENCODED_PATH=$(python -c "
          import urllib.parse
          path='''${FILE_PATH}'''
          print(urllib.parse.quote(path, safe='/'))
          ")

          echo "Encoded path:"
          echo "$ENCODED_PATH"

          HTTP_CODE=$(curl -sS \
            -o excel.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/me/drive/root:/${ENCODED_PATH}")

          echo "HTTP STATUS: ${HTTP_CODE}"

          cat excel.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Excel file was not found."
            exit 1
          fi

          ITEM_ID=$(python -c "
          import json
          d=json.load(open('excel.json'))
          print(d.get('id',''))
          ")

          if [ -z "$ITEM_ID" ]; then
            echo "ERROR: Excel ITEM_ID not found."
            exit 1
          fi

          echo "ITEM_ID=${ITEM_ID}" >> "$GITHUB_ENV"

          echo "Excel file found successfully."


      # ============================================================
      # 5. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel
        run: |
          set -e

          echo "Downloading Excel..."

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/me/drive/items/${ITEM_ID}/content" \
            -o source.xlsx

          echo "Download completed."

          ls -lh source.xlsx


      # ============================================================
      # 6. INSTALL PYTHON DEPENDENCY
      # ============================================================
      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl


      # ============================================================
      # 7. GENERATE DASHBOARD DATA
      # ============================================================
      - name: Generate dashboard data
        run: |
          python sync_excel.py

          echo "Generated data.js:"
          ls -lh data.js


      # ============================================================
      # 8. COMMIT UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dashboard data"
            git push
          fi
