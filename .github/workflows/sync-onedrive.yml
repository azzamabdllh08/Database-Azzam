name: Sync Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Excel from OneDrive
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_URL: "https://1drv.ms/x/c/8dd2c5d0a467a39a/IQBvKUJCpgGTT4rvYLy4Gt9FAbedI0g-V_jUTXwlA3QXwNI?e=fXkoQM"

        run: |
          set -e

          echo "Getting Microsoft Graph access token..."

          TOKEN_RESPONSE=$(curl -sS --fail \
            -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${AZURE_CLIENT_ID}" \
            --data-urlencode "client_secret=${AZURE_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import sys,json; print(json.load(sys.stdin)['access_token'])" <<< "$TOKEN_RESPONSE")

          echo "Access token obtained."

          echo "Encoding OneDrive sharing URL..."

          SHARE_ID=$(python -c "import base64,sys; print('u!'+base64.urlsafe_b64encode(sys.argv[1].encode()).decode().rstrip('='))" "$ONEDRIVE_URL")

          echo "Downloading Excel through Microsoft Graph..."

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o source.xlsx

          echo "Checking downloaded Excel..."

          file source.xlsx
          ls -lh source.xlsx

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade openpyxl

      - name: Generate dashboard data
        run: |
          python sync_excel.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto sync Excel data from OneDrive"
            git push
          fi
