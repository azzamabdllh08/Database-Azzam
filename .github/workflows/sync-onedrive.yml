name: Sync Excel from OneDrive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

        run: |
          set -e

          echo "Requesting Microsoft Graph token..."

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import json,sys; print(json.load(sys.stdin)['access_token'])" <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain Microsoft Graph token."
            exit 1
          fi

          echo "TOKEN=${TOKEN}" >> "$GITHUB_ENV"

          echo "Microsoft Graph token obtained successfully."


      # ============================================================
      # 3. GET USER ONEDRIVE / DRIVE ID
      # ============================================================
      - name: Get OneDrive
        env:
          USER_ID: b9083e78-c261-47fd-8620-6323689b589c

        run: |
          set -e

          echo "Getting OneDrive for user:"
          echo "${USER_ID}"

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER_ID}/drive")

          echo "Graph response:"
          echo "$RESPONSE"

          DRIVE_ID=$(python -c "import json,sys; print(json.load(sys.stdin).get('id',''))" <<< "$RESPONSE")

          if [ -z "$DRIVE_ID" ]; then
            echo "ERROR: Drive ID was not found."
            exit 1
          fi

          echo "DRIVE_ID=${DRIVE_ID}" >> "$GITHUB_ENV"

          echo "OneDrive found successfully."
          echo "Drive ID: ${DRIVE_ID}"


      # ============================================================
      # 4. FIND EXCEL FILE
      # ============================================================
      - name: Find Excel file
        run: |
          set -e

          FILE_PATH="Zona 13/Asset Register & Verifikasi/Dashboard/Site_Verification_PowerBI_Ready.xlsx"

          echo "Searching for:"
          echo "$FILE_PATH"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('''${FILE_PATH}''', safe='/'))")

          echo "Encoded path:"
          echo "$ENCODED_PATH"

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/${ENCODED_PATH}")

          echo "Graph response:"
          echo "$RESPONSE"

          ITEM_ID=$(python -c "import json,sys; print(json.load(sys.stdin).get('id',''))" <<< "$RESPONSE")

          if [ -z "$ITEM_ID" ]; then
            echo "ERROR: Excel file was not found."
            exit 1
          fi

          echo "ITEM_ID=${ITEM_ID}" >> "$GITHUB_ENV"

          echo "Excel file found successfully."
          echo "Item ID: ${ITEM_ID}"


      # ============================================================
      # 5. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel
        run: |
          set -e

          echo "Downloading Excel..."

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content" \
            -o source.xlsx

          echo "Download completed."

          ls -lh source.xlsx


      # ============================================================
      # 6. INSTALL PYTHON
      # ============================================================
      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl


      # ============================================================
      # 7. GENERATE DASHBOARD DATA
      # ============================================================
      - name: Generate dashboard data
        run: |
          python sync_excel.py

          echo "Generated data.js:"
          ls -lh data.js


      # ============================================================
      # 8. COMMIT UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dashboard data"
            git push
          fi
