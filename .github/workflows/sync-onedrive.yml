name: Sync Excel from OneDrive

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true


      # ============================================================
      # 2. GET MICROSOFT GRAPH ACCESS TOKEN
      #    Menggunakan Refresh Token OneDrive Personal
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}

        run: |
          set -e

          echo "=========================================="
          echo "GET MICROSOFT GRAPH ACCESS TOKEN"
          echo "=========================================="

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/consumers/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=Files.Read User.Read offline_access" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          ERROR=$(echo "$RESPONSE" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('error',''))
          ")

          if [ -n "$ERROR" ]; then
            echo "ERROR: Microsoft token request failed."
            echo "$RESPONSE" | python -m json.tool
            exit 1
          fi

          TOKEN=$(echo "$RESPONSE" | python -c "
          import json,sys
          print(json.load(sys.stdin).get('access_token',''))
          ")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Access token is empty."
            exit 1
          fi

          echo "TOKEN=${TOKEN}" >> "$GITHUB_ENV"

          echo "Microsoft Graph access token obtained successfully."


      # ============================================================
      # 3. GET PERSONAL ONEDRIVE
      # ============================================================
      - name: Get OneDrive
        run: |
          set -e

          echo "=========================================="
          echo "GET PERSONAL ONEDRIVE"
          echo "=========================================="

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/me/drive")

          echo "$RESPONSE" | python -m json.tool

          ERROR=$(echo "$RESPONSE" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('error',{}).get('message',''))
          ")

          if [ -n "$ERROR" ]; then
            echo "ERROR: Failed to access OneDrive."
            echo "$ERROR"
            exit 1
          fi

          DRIVE_ID=$(echo "$RESPONSE" | python -c "
          import json,sys
          print(json.load(sys.stdin).get('id',''))
          ")

          if [ -z "$DRIVE_ID" ]; then
            echo "ERROR: OneDrive Drive ID was not found."
            exit 1
          fi

          echo "DRIVE_ID=${DRIVE_ID}" >> "$GITHUB_ENV"

          echo "OneDrive found successfully."


      # ============================================================
      # 4. FIND EXCEL FILE
      # ============================================================
      - name: Find Excel file
        run: |
          set -e

          echo "=========================================="
          echo "FIND EXCEL FILE"
          echo "=========================================="

          FILE_PATH="Zona 13/Asset Register & Verifikasi/Dashboard/Site_Verification_PowerBI_Ready.xlsx"

          echo "File path:"
          echo "$FILE_PATH"

          ENCODED_PATH=$(python -c "
          import urllib.parse
          print(urllib.parse.quote('''${FILE_PATH}''', safe='/'))
          ")

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/${ENCODED_PATH}")

          echo "$RESPONSE" | python -m json.tool

          ERROR=$(echo "$RESPONSE" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('error',{}).get('message',''))
          ")

          if [ -n "$ERROR" ]; then
            echo "ERROR: Excel file could not be found."
            echo "$ERROR"
            exit 1
          fi

          ITEM_ID=$(echo "$RESPONSE" | python -c "
          import json,sys
          print(json.load(sys.stdin).get('id',''))
          ")

          if [ -z "$ITEM_ID" ]; then
            echo "ERROR: Excel Item ID was not found."
            exit 1
          fi

          echo "ITEM_ID=${ITEM_ID}" >> "$GITHUB_ENV"

          echo "Excel file found successfully."


      # ============================================================
      # 5. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD EXCEL"
          echo "=========================================="

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content" \
            -o source.xlsx

          if [ ! -f source.xlsx ]; then
            echo "ERROR: source.xlsx was not created."
            exit 1
          fi

          echo "Excel download completed."

          ls -lh source.xlsx


      # ============================================================
      # 6. INSTALL PYTHON DEPENDENCY
      # ============================================================
      - name: Install Python dependency
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL PYTHON DEPENDENCY"
          echo "=========================================="

          python -m pip install --upgrade pip
          pip install openpyxl

          echo "Python dependencies installed."


      # ============================================================
      # 7. GENERATE DASHBOARD DATA
      # ============================================================
      - name: Generate dashboard data
        run: |
          set -e

          echo "=========================================="
          echo "GENERATE DASHBOARD DATA"
          echo "=========================================="

          if [ ! -f sync_excel.py ]; then
            echo "ERROR: sync_excel.py not found."
            exit 1
          fi

          python sync_excel.py

          if [ ! -f data.js ]; then
            echo "ERROR: data.js was not generated."
            exit 1
          fi

          echo "Dashboard data generated successfully."

          ls -lh data.js


      # ============================================================
      # 8. COMMIT AND PUSH UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          set -e

          echo "=========================================="
          echo "COMMIT AND PUSH UPDATED DATA"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected in data.js."
            exit 0
          fi

          git commit -m "Update dashboard data"

          echo "Pushing changes to main..."

          git push origin HEAD:main

          echo "=========================================="
          echo "SYNC COMPLETED SUCCESSFULLY"
          echo "=========================================="
