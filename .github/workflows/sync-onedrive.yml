name: Sync Excel from OneDrive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 1. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

        run: |
          set -e

          echo "Requesting Microsoft Graph token..."

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import json,sys; print(json.load(sys.stdin)['access_token'])" <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "Failed to obtain Microsoft Graph token."
            exit 1
          fi

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Microsoft Graph token obtained successfully."

      # ============================================================
      # 2. SEARCH EXCEL FILE
      # ============================================================
      - name: Find Excel file in OneDrive
        run: |
          set -e

          USER="azzam.abdullah@pttmg.com"
          FILE_NAME="Site_Verification_PowerBI_Ready.xlsx"

          echo "Searching OneDrive for:"
          echo "$FILE_NAME"

          SEARCH_URL="https://graph.microsoft.com/v1.0/users/${USER}/drive/root/search(q='${FILE_NAME}')"

          RESPONSE=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            "$SEARCH_URL")

          echo "Search response received."

          echo "$RESPONSE" > search_result.json

          python - <<'PY'
          import json
          import sys

          with open("search_result.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          if not items:
              print("ERROR: Excel file tidak ditemukan di OneDrive.")
              sys.exit(1)

          target = None

          for item in items:
              name = item.get("name", "")
              print("Found:", name)

              if name.lower() == "site_verification_powerbi_ready.xlsx":
                  target = item
                  break

          if target is None:
              print("ERROR: File dengan nama yang tepat tidak ditemukan.")
              sys.exit(1)

          item_id = target["id"]

          print("Excel ditemukan.")
          print("File name:", target.get("name"))
          print("File ID:", item_id)

          with open("excel_item_id.txt", "w", encoding="utf-8") as f:
              f.write(item_id)
          PY

      # ============================================================
      # 3. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel from OneDrive
        run: |
          set -e

          USER="azzam.abdullah@pttmg.com"
          ITEM_ID=$(cat excel_item_id.txt)

          echo "Downloading Excel using Drive Item ID..."

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER}/drive/items/${ITEM_ID}/content" \
            -o source.xlsx

          echo "Download completed."

          ls -lh source.xlsx

          file source.xlsx

      # ============================================================
      # 4. INSTALL PYTHON DEPENDENCY
      # ============================================================
      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      # ============================================================
      # 5. GENERATE DASHBOARD DATA
      # ============================================================
      - name: Generate dashboard data
        run: |
          python sync_excel.py

      # ============================================================
      # 6. COMMIT UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dashboard data"
            git push
          fi
