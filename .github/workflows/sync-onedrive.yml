name: Sync Excel from OneDrive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

        run: |
          set -e

          echo "======================================"
          echo "GET MICROSOFT GRAPH TOKEN"
          echo "======================================"

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          echo "Token response received."

          TOKEN=$(python -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Microsoft Graph token gagal diperoleh."
            echo "$RESPONSE"
            exit 1
          fi

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Microsoft Graph token: OK"


      # ============================================================
      # 3. CHECK ONEDRIVE
      # ============================================================
      - name: Check OneDrive
        run: |
          set -e

          USER="azzam.abdullah@pttmg.com"

          echo "======================================"
          echo "CHECK ONEDRIVE"
          echo "======================================"

          echo "User:"
          echo "$USER"

          echo ""
          echo "Requesting OneDrive information..."

          HTTP_CODE=$(curl -sS \
            -o drive_response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER}/drive")

          echo ""
          echo "HTTP STATUS: $HTTP_CODE"

          echo ""
          echo "GRAPH RESPONSE:"
          cat drive_response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "ERROR: OneDrive tidak dapat diakses."
            exit 1
          fi

          python - <<'PY'
          import json

          with open("drive_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("======================================")
          print("ONEDRIVE INFORMATION")
          print("======================================")
          print("Drive ID   :", data.get("id"))
          print("Drive Type :", data.get("driveType"))
          print("Drive Name :", data.get("name"))
          print("Owner      :", data.get("owner"))
          print("======================================")
          PY


      # ============================================================
      # 4. SEARCH EXCEL FILE
      # ============================================================
      - name: Find Excel file in OneDrive
        run: |
          set -e

          USER="azzam.abdullah@pttmg.com"
          FILE_NAME="Site_Verification_PowerBI_Ready.xlsx"

          echo "======================================"
          echo "SEARCH EXCEL FILE"
          echo "======================================"

          echo "File:"
          echo "$FILE_NAME"

          SEARCH_URL="https://graph.microsoft.com/v1.0/users/${USER}/drive/root/search(q='${FILE_NAME}')"

          echo ""
          echo "Searching..."

          HTTP_CODE=$(curl -sS \
            -o search_result.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "$SEARCH_URL")

          echo ""
          echo "HTTP STATUS: $HTTP_CODE"

          echo ""
          echo "SEARCH RESPONSE:"
          cat search_result.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "ERROR: Search OneDrive gagal."
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          with open("search_result.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          print("")
          print("======================================")
          print("SEARCH RESULT")
          print("======================================")

          print("Jumlah hasil:", len(items))

          if not items:
              print("")
              print("ERROR: File Excel tidak ditemukan.")
              print("")
              print("Pastikan nama file adalah:")
              print("Site_Verification_PowerBI_Ready.xlsx")
              sys.exit(1)

          target = None

          for item in items:
              print("")
              print("Name :", item.get("name"))
              print("ID   :", item.get("id"))
              print("Path :", item.get("parentReference", {}).get("path"))

              if item.get("name", "").lower() == "site_verification_powerbi_ready.xlsx":
                  target = item

          if target is None:
              print("")
              print("ERROR: File dengan nama tepat tidak ditemukan.")
              sys.exit(1)

          item_id = target["id"]

          print("")
          print("======================================")
          print("TARGET FILE FOUND")
          print("======================================")
          print("Name:", target.get("name"))
          print("ID  :", item_id)

          with open("excel_item_id.txt", "w", encoding="utf-8") as f:
              f.write(item_id)

          print("======================================")
          PY


      # ============================================================
      # 5. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel from OneDrive
        run: |
          set -e

          USER="azzam.abdullah@pttmg.com"
          ITEM_ID=$(cat excel_item_id.txt)

          echo "======================================"
          echo "DOWNLOAD EXCEL"
          echo "======================================"

          echo "Item ID:"
          echo "$ITEM_ID"

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER}/drive/items/${ITEM_ID}/content" \
            -o source.xlsx

          echo ""
          echo "Download completed."

          echo ""
          echo "FILE INFORMATION:"
          ls -lh source.xlsx
          file source.xlsx


      # ============================================================
      # 6. INSTALL PYTHON
      # ============================================================
      - name: Install Python dependency
        run: |
          set -e

          python --version

          python -m pip install --upgrade pip

          pip install openpyxl


      # ============================================================
      # 7. GENERATE DASHBOARD DATA
      # ============================================================
      - name: Generate dashboard data
        run: |
          set -e

          echo "======================================"
          echo "GENERATE DASHBOARD DATA"
          echo "======================================"

          python sync_excel.py

          echo ""
          echo "Generated data.js:"
          ls -lh data.js


      # ============================================================
      # 8. COMMIT UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          set -e

          echo "======================================"
          echo "COMMIT UPDATED DATA"
          echo "======================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dashboard data"
            git push
          fi

          echo "======================================"
          echo "SYNC COMPLETED"
          echo "======================================"
