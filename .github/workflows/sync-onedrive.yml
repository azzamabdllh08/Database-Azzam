name: Sync Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Excel from OneDrive
        env:
          ONEDRIVE_URL: "https://1drv.ms/x/c/8dd2c5d0a467a39a/IQBvKUJCpgGTT4rvYLy4Gt9FAbedI0g-V_jUTXwlA3QXwNI?download=1"
        run: |
          curl -L --fail --retry 3 "$ONEDRIVE_URL" -o source.xlsx
          file source.xlsx
          ls -lh source.xlsx

      - name: Install Python dependency
        run: python -m pip install --upgrade openpyxl

      - name: Generate dashboard data
        run: python sync_excel.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto sync Excel data from OneDrive"
            git push
          fi
