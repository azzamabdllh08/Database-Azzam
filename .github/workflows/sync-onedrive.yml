name: Sync Excel from OneDrive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

        run: |
          set -e

          echo "Getting Microsoft Graph token..."

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain Microsoft Graph token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Graph token: OK"


      # ============================================================
      # 3. GET ONEDRIVE
      # ============================================================
      - name: Get OneDrive
        env:
          USER_OBJECT_ID: b9083e78-c261-47fd-8620-6323689b589c

        run: |
          set -e

          echo "Getting OneDrive..."

          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER_OBJECT_ID}/drive" \
            -o drive.json

          echo "OneDrive response:"
          cat drive.json

          python - <<'PY'
          import json

          with open("drive.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("======================================")
          print("ONEDRIVE FOUND")
          print("======================================")
          print("Drive ID   :", data.get("id"))
          print("Drive Type :", data.get("driveType"))
          print("Drive Name :", data.get("name"))
          print("======================================")
          PY


      # ============================================================
      # 4. SEARCH EXCEL
      # ============================================================
      - name: Find Excel file
        env:
          USER_OBJECT_ID: b9083e78-c261-47fd-8620-6323689b589c

        run: |
          set -e

          FILE_NAME="Site_Verification_PowerBI_Ready.xlsx"

          echo "Searching for:"
          echo "$FILE_NAME"

          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER_OBJECT_ID}/drive/root/search(q='${FILE_NAME}')" \
            -o search.json

          echo ""
          echo "Search result:"
          cat search.json

          python - <<'PY'
          import json
          import sys

          with open("search.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          print("")
          print("======================================")
          print("SEARCH RESULTS")
          print("======================================")

          print("Found:", len(items), "item(s)")

          target = None

          for item in items:
              print("")
              print("Name:", item.get("name"))
              print("ID:", item.get("id"))
              print("Path:", item.get("parentReference", {}).get("path"))

              if item.get("name", "").lower() == \
                 "site_verification_powerbi_ready.xlsx":
                  target = item

          if target is None:
              print("")
              print("ERROR: Site_Verification_PowerBI_Ready.xlsx tidak ditemukan.")
              sys.exit(1)

          with open("excel_item_id.txt", "w", encoding="utf-8") as f:
              f.write(target["id"])

          print("")
          print("======================================")
          print("EXCEL FOUND")
          print("======================================")
          print("File:", target["name"])
          print("ID  :", target["id"])
          PY


      # ============================================================
      # 5. DOWNLOAD EXCEL
      # ============================================================
      - name: Download Excel
        env:
          USER_OBJECT_ID: b9083e78-c261-47fd-8620-6323689b589c

        run: |
          set -e

          ITEM_ID=$(cat excel_item_id.txt)

          echo "Downloading Excel..."
          echo "Item ID: $ITEM_ID"

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER_OBJECT_ID}/drive/items/${ITEM_ID}/content" \
            -o source.xlsx

          echo ""
          echo "Download completed."

          ls -lh source.xlsx


      # ============================================================
      # 6. INSTALL PYTHON DEPENDENCY
      # ============================================================
      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl


      # ============================================================
      # 7. GENERATE DATA.JS
      # ============================================================
      - name: Generate dashboard data
        run: |
          set -e

          echo "Running sync_excel.py..."

          python sync_excel.py

          echo ""
          echo "Generated data.js:"
          ls -lh data.js


      # ============================================================
      # 8. COMMIT DATA.JS
      # ============================================================
      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dashboard data"
            git push
          fi

          echo ""
          echo "SYNC COMPLETED SUCCESSFULLY"
